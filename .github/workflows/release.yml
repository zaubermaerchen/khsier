name: Release

on:
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "go.mod"
      - "go.sum"
      - "*.go"
      - "LICENSE"
      - "README.md"
      - "docs/**"
      - "cmd/**"
      - "internal/**"
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: khsier-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      homebrew-eligible: ${{ steps.version.outputs.homebrew-eligible }}
    steps:
      - name: Resolve and validate version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          number='(0|[1-9][0-9]*)'
          prerelease_identifier='(0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)'
          build_identifier='[0-9A-Za-z-]+'
          semver="^v${number}\.${number}\.${number}(-${prerelease_identifier}(\.${prerelease_identifier})*)?(\+${build_identifier}(\.${build_identifier})*)?$"

          valid_versions=(v0.1.0 v1.2.3-0 v1.2.3-alpha.1 v1.2.3+build.01)
          invalid_versions=(v1.2 v01.2.3 v1.2.3-01 v1.2.3-alpha.01)
          for candidate in "${valid_versions[@]}"; do
            if [[ ! "$candidate" =~ $semver ]]; then
              echo "tag validator rejected valid version: $candidate" >&2
              exit 1
            fi
          done
          for candidate in "${invalid_versions[@]}"; do
            if [[ "$candidate" =~ $semver ]]; then
              echo "tag validator accepted invalid version: $candidate" >&2
              exit 1
            fi
          done

          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            version="$GITHUB_REF_NAME"
            if [[ ! "$version" =~ $semver ]]; then
              echo "invalid release tag: $version" >&2
              exit 1
            fi
          else
            version=snapshot
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          stable="^v${number}\.${number}\.${number}$"
          homebrew_eligible=false
          if [[ "$version" =~ $stable ]]; then
            homebrew_eligible=true
          fi
          printf 'homebrew-eligible=%s\n' "$homebrew_eligible" >> "$GITHUB_OUTPUT"

  test:
    name: Test
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...

  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    needs:
      - prepare
      - test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            release_arch: amd64
          - goos: linux
            goarch: arm64
            release_arch: arm64
          - goos: darwin
            goarch: amd64
            release_arch: amd64
          - goos: darwin
            goarch: arm64
            release_arch: arm64
          - goos: windows
            goarch: amd64
            release_arch: amd64
          - goos: windows
            goarch: arm64
            release_arch: arm64
          - goos: linux
            goarch: arm
            goarm: 6
            release_arch: armv6
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Build and package
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TARGET_OS: ${{ matrix.goos }}
          TARGET_ARCH: ${{ matrix.goarch }}
          TARGET_RELEASE_ARCH: ${{ matrix.release_arch }}
          TARGET_GOARM: ${{ matrix.goarm }}
        run: |
          set -euo pipefail
          package_name="khsier_${VERSION}_${TARGET_OS}_${TARGET_RELEASE_ARCH}"
          staging="${RUNNER_TEMP}/${package_name}"
          package_dir="${RUNNER_TEMP}/khsier-package"
          rm -rf "$staging" "$package_dir"
          mkdir -p "$staging/$package_name" "$package_dir"

          khsier_binary=khsier
          if [[ "$TARGET_OS" == windows ]]; then
            khsier_binary+=.exe
          fi
          build_env=(CGO_ENABLED=0 GOOS="$TARGET_OS" GOARCH="$TARGET_ARCH")
          if [[ -n "$TARGET_GOARM" ]]; then
            build_env+=(GOARM="$TARGET_GOARM")
          fi
          env "${build_env[@]}" \
            go build -trimpath -ldflags="-s -w -X github.com/zaubermaerchen/khsier/internal/khsier.version=${VERSION}" \
              -o "$staging/$package_name/$khsier_binary" ./cmd/khsier
          cp LICENSE README.md "$staging/$package_name/"
          cp -R docs "$staging/$package_name/"
          test -s "$staging/$package_name/$khsier_binary"

          if [[ "$TARGET_OS" == linux && "$TARGET_ARCH" == amd64 ]]; then
            actual_khsier_version="$("$staging/$package_name/$khsier_binary" --version)"
            expected_khsier_version="khsier $VERSION"
            if [[ "$actual_khsier_version" != "$expected_khsier_version" ]]; then
              echo "khsier version output mismatch: got $actual_khsier_version, want $expected_khsier_version" >&2
              exit 1
            fi
          fi

          if [[ "$TARGET_OS" == windows ]]; then
            archive="${package_name}.zip"
            (cd "$staging" && zip -q -r "${RUNNER_TEMP}/${archive}" "$package_name")
          else
            archive="${package_name}.tar.gz"
            tar -C "$staging" -czf "${RUNNER_TEMP}/${archive}" "$package_name"
          fi
          archive_path="${RUNNER_TEMP}/${archive}"
          test -s "$archive_path"

          expected="${RUNNER_TEMP}/${package_name}.expected"
          actual="${RUNNER_TEMP}/${package_name}.actual"
          {
            printf '%s\n' "$package_name/"
            printf '%s\n' "$package_name/$khsier_binary"
            printf '%s\n' "$package_name/LICENSE"
            printf '%s\n' "$package_name/README.md"
            printf '%s\n' "$package_name/docs/"
            printf '%s\n' "$package_name/docs/khsier.md"
            printf '%s\n' "$package_name/docs/releasing.md"
          } | sort > "$expected"
          if [[ "$TARGET_OS" == windows ]]; then
            unzip -Z1 "$archive_path" | sort > "$actual"
          else
            tar -tzf "$archive_path" | sort > "$actual"
          fi
          diff -u "$expected" "$actual"
          cp "$archive_path" "$package_dir/"
      - name: Upload archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: khsier-${{ matrix.goos }}-${{ matrix.release_arch }}
          path: ${{ runner.temp }}/khsier-package/*
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs:
      - prepare
      - build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release
          merge-multiple: true
      - name: Validate archives and create checksums
        shell: bash
        run: |
          set -euo pipefail
          expected=(
            "khsier_${VERSION}_linux_amd64.tar.gz"
            "khsier_${VERSION}_linux_arm64.tar.gz"
            "khsier_${VERSION}_linux_armv6.tar.gz"
            "khsier_${VERSION}_darwin_amd64.tar.gz"
            "khsier_${VERSION}_darwin_arm64.tar.gz"
            "khsier_${VERSION}_windows_amd64.zip"
            "khsier_${VERSION}_windows_arm64.zip"
          )
          mapfile -t actual < <(find release -mindepth 1 -maxdepth 1 -type f -printf '%f\n' | sort)
          if (( ${#actual[@]} != 7 )); then
            echo "expected seven archives, found ${#actual[@]}" >&2
            exit 1
          fi
          printf '%s\n' "${expected[@]}" | sort > expected.txt
          printf '%s\n' "${actual[@]}" > actual.txt
          diff -u expected.txt actual.txt
          for archive in "${expected[@]}"; do
            test -s "release/$archive"
          done
          (
            cd release
            sha256sum "${expected[@]}" > SHA256SUMS
            sha256sum -c SHA256SUMS
          )
          test -s release/SHA256SUMS
      - name: Publish GitHub release
        shell: bash
        run: |
          set -euo pipefail
          tag_ref="refs/tags/$GITHUB_REF_NAME"
          tag_type="$(git cat-file -t "$tag_ref" 2>/dev/null || true)"
          if [[ "$tag_type" != tag ]]; then
            echo "release tag $GITHUB_REF_NAME must be an annotated tag (found ${tag_type:-missing})" >&2
            exit 1
          fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release already exists for tag $GITHUB_REF_NAME" >&2
            exit 1
          fi
          archives=(
            "release/khsier_${VERSION}_linux_amd64.tar.gz"
            "release/khsier_${VERSION}_linux_arm64.tar.gz"
            "release/khsier_${VERSION}_linux_armv6.tar.gz"
            "release/khsier_${VERSION}_darwin_amd64.tar.gz"
            "release/khsier_${VERSION}_darwin_arm64.tar.gz"
            "release/khsier_${VERSION}_windows_amd64.zip"
            "release/khsier_${VERSION}_windows_arm64.zip"
          )
          gh release create "$GITHUB_REF_NAME" --verify-tag --notes-from-tag --title "$GITHUB_REF_NAME" "${archives[@]}" release/SHA256SUMS

  homebrew:
    name: Propose Homebrew Formula update
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && needs.prepare.outputs.homebrew-eligible == 'true'
    needs:
      - prepare
      - release
    permissions:
      contents: read
    # Deploy the tap first, then pin both refs to its reviewed merge commit.
    uses: zaubermaerchen/homebrew-tap/.github/workflows/update-formula.yml@7b06d9b7b3767d7e552bf3bca765f07da0171e65
    with:
      formula: khsier
      tag: ${{ needs.prepare.outputs.version }}
      automation-ref: 7b06d9b7b3767d7e552bf3bca765f07da0171e65
      app-id: ${{ vars.HOMEBREW_TAP_APP_ID }}
    secrets:
      app-private-key: ${{ secrets.HOMEBREW_TAP_APP_PRIVATE_KEY }}
